name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  check:
    name: Validate, test and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Format check
        run: npm run format:check

      - name: Validate customizations
        run: npm run validate

      - name: Test with coverage
        run: npm test

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  browser-test:
    name: Browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AIP_AXE_FROM: ${{ runner.temp }}/axe-tools
      AIP_REQUIRE_BROWSER_TESTS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install axe and Playwright outside the repository
        run: |
          mkdir -p "$AIP_AXE_FROM"
          cd "$AIP_AXE_FROM"
          npm init -y
          npm install --save-exact @axe-core/playwright@4.14.0 playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Run axe scan tests
        run: node --test test/axe-scan.test.js

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
